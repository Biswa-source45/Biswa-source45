name: Update Profile Cards

on:
  schedule:
    - cron: "0 18 * * *"   # daily, ~11:30 PM IST
  workflow_dispatch:        # run manually from the Actions tab
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/update-profile.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Generate stats, languages & streak cards
        run: python3 scripts/generate_stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          if git commit -m "chore: update profile cards"; then
            git push
          fi
